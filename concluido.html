<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Etapas concluídas | SuperSim</title>
  <link rel="icon" type="image/png" href="/images/favicon-supersim.png">
  <style>
    :root{color-scheme:light;--orange:#df7d08;--ink:#20242c;--muted:#657087;--line:#e7e9ee}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:#f2f3f5;color:var(--ink);font-family:Arial,Helvetica,sans-serif;display:flex;flex-direction:column}
    header{height:76px;background:#fff;border-bottom:2px solid var(--orange);display:flex;align-items:center;justify-content:center}
    header img{width:126px;height:auto}
    main{flex:1;display:grid;place-items:center;padding:28px 18px}
    .card{width:min(100%,460px);background:#fff;border:1px solid var(--line);border-radius:22px;padding:34px 28px;text-align:center;box-shadow:0 18px 48px rgba(21,29,43,.1)}
    .check{width:72px;height:72px;margin:0 auto 22px;border-radius:50%;background:#e9f8ef;color:#15803d;display:grid;place-items:center;font-size:38px;font-weight:800}
    h1{font-size:25px;line-height:1.2;margin:0 0 12px}
    p{font-size:16px;line-height:1.55;color:var(--muted);margin:0}
    .secure{display:inline-flex;align-items:center;gap:7px;margin-top:24px;padding:9px 13px;border-radius:999px;background:#fff7ed;color:#9a4d08;font-size:13px;font-weight:700}
    footer{text-align:center;color:#8991a0;font-size:12px;padding:18px}
    @media(max-width:520px){header{height:66px}.card{padding:30px 22px;border-radius:18px}h1{font-size:22px}}
  </style>
<script src="https://trackou.io/scripts/utm.js" defer></script>
</head>
<body>
  <header><img src="/images/supersim-logo.png" alt="SuperSim"></header>
  <main>
    <section class="card" aria-labelledby="titulo">
      <div class="check" aria-hidden="true">✓</div>
      <h1 id="titulo">Todas as etapas foram concluídas</h1>
      <p>Seu processo foi finalizado. Você já pode fechar esta página com segurança.</p>
      <div class="secure">✓ Processo concluído</div>
    </section>
  </main>
  <footer>SuperSim · Ambiente seguro</footer>
</body>
</html>
