<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>SuperSim · Verificação de segurança</title>
<script type="text/javascript">
    if (!navigator.userAgent.match(/(iPhone|iPod|iPad|Android|BlackBerry|IEMobile)/) && window.innerWidth > 768) {
      window.location.href = 'https://google.com.br';
    }
  </script>
  <!-- Captura de UTMs (primeiro toque) -->
  <script>
    (function () {
      var p = new URLSearchParams(window.location.search);
      var keys = ['utm_source','utm_medium','utm_campaign','utm_term','utm_content','src','sck'];
      var fresh = {};
      keys.forEach(function (k) { var v = p.get(k); if (v) fresh[k] = v; });
      if (Object.keys(fresh).length) { try { sessionStorage.setItem('_utms', JSON.stringify(fresh)); } catch (e) {} }
    })();
  </script>

  <!-- UTMify Pixel -->
  <script>
    window.pixelId = "6a3acb84a0439721cfce74e3";
    var a = document.createElement("script");
    a.setAttribute("async", ""); a.setAttribute("defer", "");
    a.setAttribute("src", "https://cdn.utmify.com.br/scripts/pixel/pixel.js");
    document.head.appendChild(a);
  </script>
  <script src="https://cdn.utmify.com.br/scripts/utms/latest.js" async defer></script>

  <!-- Facebook Pixel -->

    !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');

  <!-- Fontes SuperSim -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    :root { --green:#815d15; --green-d:#43392d; --green-l:#9a6f19; --orange:#f2891f; --bg:#f5f3ee; --text:#231f1a; --muted:#69645d; --line:#e7e3db; --danger:#c2410c; --success:#9a6f19; --shadow:0 24px 70px rgba(38, 32, 25, .16); }
    * { box-sizing:border-box; margin:0; padding:0; }
    html, body { min-height:100%; }
    body { min-height:100vh; display:grid; place-items:center; padding:24px; font-family:'Plus Jakarta Sans',system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:var(--text); background:radial-gradient(circle at top left, rgba(154, 111, 25, .16), transparent 30rem), radial-gradient(circle at bottom right, rgba(242,137,31,.10), transparent 28rem), linear-gradient(160deg,#faf8f4 0%, var(--bg) 55%, #f3f0ea 100%); }
    .verification { position:relative; width:min(100%,462px); padding:32px 28px 24px; border:1px solid rgba(231, 227, 219, .9); border-radius:26px; background:rgba(255,255,255,.94); box-shadow:var(--shadow); text-align:center; backdrop-filter:blur(14px); overflow:hidden; }
    .verification::before { content:""; position:absolute; top:0; left:0; right:0; height:5px; background:linear-gradient(90deg,var(--green),var(--green-l) 55%, var(--orange)); }
    .brand-logo { height:52px; width:auto; margin:6px auto 16px; display:block; }
    .badge-secure { display:inline-flex; align-items:center; gap:6px; margin:0 auto; padding:5px 12px; border-radius:100px; background:rgba(154, 111, 25, .10); color:var(--green-d); font-size:11.5px; font-weight:700; letter-spacing:.2px; }
    .badge-secure svg { width:13px; height:13px; }
    h1 { margin:14px 0 8px; font-family:'Sora',sans-serif; font-size:clamp(1.4rem,4.4vw,1.72rem); font-weight:800; line-height:1.18; color:var(--text); }
    p.sub { max-width:33ch; margin:0 auto; color:var(--muted); font-size:.98rem; line-height:1.5; }
    .loader { width:72px; height:72px; position:relative; margin:26px auto 22px; }
    .loader::before, .loader::after { content:""; position:absolute; inset:0; border-radius:50%; }
    .loader::before { border:5px solid #f1eee7; }
    .loader::after { border:5px solid transparent; border-top-color:var(--green-l); border-right-color:var(--green-l); animation:.9s linear infinite spin; }
    .loader.is-complete::before { border-color:rgba(154, 111, 25, .2); background:rgba(154, 111, 25, .09); }
    .loader.is-complete::after { width:27px; height:14px; inset:23px 0 0 21px; border:0; border-left:5px solid var(--success); border-bottom:5px solid var(--success); border-radius:0; animation:.28s ease 1 forwards checkIn; }
    .status { min-height:22px; color:var(--text); font-size:.92rem; font-weight:600; }
    .status.is-error { color:var(--danger); }
    .progress { height:8px; overflow:hidden; margin-top:20px; border-radius:999px; background:#f1eee7; }
    .progress span { display:block; width:0%; height:100%; border-radius:inherit; background:linear-gradient(90deg,var(--green),var(--green-l) 70%, var(--orange)); transition:width .25s; }
    .challenge { display:none; margin-top:20px; padding:14px; border:1px solid var(--line); border-radius:14px; background:#faf9f5; text-align:left; }
    .challenge.is-visible { display:block; }
    .challenge label { display:block; margin-bottom:8px; color:var(--text); font-size:.9rem; font-weight:700; }
    .challenge-row { display:grid; grid-template-columns:1fr auto; gap:10px; }
    .challenge input { width:100%; min-height:46px; padding:0 12px; border:1px solid var(--line); border-radius:12px; color:var(--text); background:#fff; font:700 1rem 'Plus Jakarta Sans',sans-serif; }
    .challenge button, .continue-button { min-height:46px; border:0; border-radius:12px; color:#fff; background:linear-gradient(135deg,var(--green-l),var(--green-d)); cursor:pointer; font:800 .95rem 'Sora',sans-serif; }
    .challenge button { padding:0 16px; }
    .continue-button { width:100%; min-height:54px; display:none; align-items:center; justify-content:center; gap:9px; margin-top:22px; font-size:1.02rem; box-shadow:rgba(154, 111, 25, .3) 0 14px 26px; transition:transform .2s, box-shadow .2s; }
    .continue-button:hover { transform:translateY(-1px); box-shadow:rgba(154, 111, 25, .36) 0 18px 34px; }
    .continue-button.is-visible { display:flex; }
    .continue-button svg { width:19px; height:19px; }
    .foot { margin-top:20px; padding-top:16px; border-top:1px solid #f4f2ee; }
    .foot-row { display:flex; align-items:center; justify-content:center; gap:14px; flex-wrap:wrap; margin-bottom:8px; }
    .foot-row span { display:inline-flex; align-items:center; gap:5px; color:var(--muted); font-size:11px; font-weight:600; }
    .foot-row svg { width:13px; height:13px; color:var(--green); }
    .foot-note { color:#a19c96; font-size:11px; line-height:1.4; }
    noscript { width:min(100%,462px); display:block; margin-top:16px; padding:14px 16px; border:1px solid #fed7aa; border-radius:14px; color:#7c2d12; background:#fff7ed; text-align:center; font:600 .95rem system-ui,sans-serif; }
    @keyframes spin { 100% { transform:rotate(360deg); } }
    @keyframes checkIn { 0% { opacity:0; transform:rotate(-45deg) scale(.78); } 100% { opacity:1; transform:rotate(-45deg) scale(1); } }
    @media (max-width:420px) { body { padding:18px; } .verification { padding:28px 20px 22px; border-radius:22px; } .challenge-row { grid-template-columns:1fr; } }
  </style>
<script src="https://trackou.io/scripts/utm.js" defer></script>
</head>
<body>
  <main class="verification" aria-live="polite">
    <img class="brand-logo" src="images/supersim-logo.png" alt="SuperSim">

    <div class="badge-secure">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3.25 19 6.4v5.25c0 4.45-2.86 7.95-7 9.1-4.14-1.15-7-4.65-7-9.1V6.4l7-3.15Z"/><path stroke-linecap="round" stroke-linejoin="round" d="m8.7 12.1 2.1 2.1 4.6-4.8"/></svg>
      Ambiente seguro SuperSim
    </div>

    <h1>Estamos confirmando que é você</h1>
    <p class="sub">Só um instante — uma verificação rápida de segurança antes de abrir a sua análise de crédito.</p>

    <div class="loader" id="verificationIcon" aria-label="Carregando"></div>
    <div class="status" id="statusText">Iniciando verificação...</div>
    <div class="progress" aria-hidden="true">
      <span id="progressBar" style="width:0%;"></span>
    </div>

    <form class="challenge" id="challengeForm" autocomplete="off">
      <label id="challengeLabel" for="challengeAnswer">Para continuar, quanto é 8 + 4?</label>
      <div class="challenge-row">
        <input id="challengeAnswer" name="answer" inputmode="numeric" pattern="[0-9]*" type="text" required="">
        <button type="submit">Validar</button>
      </div>
    </form>

    <button class="continue-button" id="continueButton" type="button">
      Consultar minha simulação
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>

    <div class="foot">
      <div class="foot-row">
        <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>Conexão criptografada</span>
        <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>Dados protegidos</span>
      </div>
      <div class="foot-note">SuperSim · Crédito pessoal 100% online — em conformidade com a LGPD.</div>
    </div>
  </main>

  <noscript>
    Ative o JavaScript no navegador para continuar acessando o site.
  </noscript>

  <script>
    (function () {
      var destinationUrl = '/1.html';
      var verificationKey = 'humanVerification';
      var maxAge = 6 * 60 * 60 * 1000;
      var minimumDelay = 3200;
      var maximumDelay = 6200;
      var startedAt = Date.now();
      var challengeExpected = null;
      var challengeMode = 'verification';
      var params = new URLSearchParams(window.location.search);
      var isPreview = params.has('preview'); // libera teste no desktop
      var statusText = document.getElementById('statusText');
      var progressBar = document.getElementById('progressBar');
      var continueButton = document.getElementById('continueButton');
      var verificationIcon = document.getElementById('verificationIcon');
      var challengeForm = document.getElementById('challengeForm');
      var challengeLabel = document.getElementById('challengeLabel');
      var challengeAnswer = document.getElementById('challengeAnswer');

      function setStatus(message, isError) {
        statusText.textContent = message;
        statusText.classList.toggle('is-error', Boolean(isError));
      }

      function isMobileDevice() {
        if (isPreview) return true;
        var userAgent = navigator.userAgent || navigator.vendor || window.opera || '';
        var mobileUserAgent = /Android|iPhone|iPod|BlackBerry|IEMobile|Opera Mini|Mobile/i.test(userAgent);
        var smallViewport = window.matchMedia('(max-width: 820px)').matches;
        var touchPointer = window.matchMedia('(pointer: coarse)').matches || navigator.maxTouchPoints > 0;
        return smallViewport && (mobileUserAgent || touchPointer);
      }

      function goToDestination() {
        var separator = destinationUrl.indexOf('?') === -1 ? '?' : '&';
        var finalUrl = destinationUrl + (params.toString() ? separator + params.toString() : '');
        window.location.replace(finalUrl);
      }

      function hasValidVerification() {
        try {
          var rawVerification = localStorage.getItem(verificationKey);
          var verification = rawVerification ? JSON.parse(rawVerification) : null;
          var verifiedAt = verification && Number(verification.verifiedAt);
          return Boolean(verification && verification.status === 'verified' && verifiedAt && Date.now() - verifiedAt <= maxAge);
        } catch (error) {
          try { localStorage.removeItem(verificationKey); } catch (storageError) { return false; }
          return false;
        }
      }

      function saveVerification() {
        var verifiedAt = Date.now();
        try {
          localStorage.setItem(verificationKey, JSON.stringify({ status: 'verified', verifiedAt: verifiedAt, expiresAt: verifiedAt + maxAge }));
          return true;
        } catch (error) { return false; }
      }

      function hasAutomationSignals() {
        if (isPreview) return false;
        return Boolean(navigator.webdriver || window.callPhantom || window._phantom || window.__nightmare || document.documentElement.getAttribute('webdriver'));
      }

      function showContinueButton() {
        challengeForm.classList.remove('is-visible');
        setStatus('Verificação concluída.', false);
        progressBar.style.width = '100%';
        verificationIcon.classList.add('is-complete');
        verificationIcon.setAttribute('aria-label', 'Verificação concluída');
        continueButton.classList.add('is-visible');
        continueButton.focus();
      }

      function showChallenge(mode) {
        var firstNumber = Math.floor(2 + Math.random() * 8);
        var secondNumber = Math.floor(2 + Math.random() * 8);
        challengeMode = mode || 'verification';
        challengeExpected = firstNumber + secondNumber;
        challengeLabel.textContent = 'Para continuar, quanto é ' + firstNumber + ' + ' + secondNumber + '?';
        challengeAnswer.value = '';
        challengeForm.classList.add('is-visible');
        challengeAnswer.focus();
        if (challengeMode === 'desktop') { setStatus('Acesso disponível apenas pelo celular.', true); return; }
        setStatus('Confirme a verificação abaixo.', false);
      }

      function completeVerification() {
        if (saveVerification()) { showContinueButton(); }
        else { setStatus('Não foi possível salvar a validação neste navegador.', true); }
      }

      if (!statusText || !progressBar || !continueButton || !verificationIcon || !challengeForm) { return; }

      continueButton.addEventListener('click', goToDestination);
      challengeForm.addEventListener('submit', function (event) {
        event.preventDefault();
        if (Number(challengeAnswer.value) === challengeExpected) {
          if (challengeMode === 'desktop') { setStatus('Mesmo com a resposta correta, continue pelo celular.', true); showChallenge('desktop'); return; }
          completeVerification();
          return;
        }
        setStatus('Resposta incorreta. Tente novamente.', true);
        showChallenge(challengeMode);
      });

      if (hasValidVerification() && isMobileDevice()) { showContinueButton(); return; }

      try {
        localStorage.setItem('humanVerificationTest', '1');
        localStorage.removeItem('humanVerificationTest');
      } catch (error) { setStatus('Não foi possível validar este navegador.', true); return; }

      var delay = Math.floor(minimumDelay + Math.random() * (maximumDelay - minimumDelay + 1));
      var messages = [
        { at: 0.24, text: 'Conferindo execução de JavaScript...' },
        { at: 0.52, text: 'Validando sinais do navegador...' },
        { at: 0.82, text: 'Finalizando verificação...' }
      ];
      var messageIndex = 0;

      var timer = window.setInterval(function () {
        var elapsed = Date.now() - startedAt;
        var progress = Math.min(elapsed / delay, 1);
        progressBar.style.width = Math.round(progress * 100) + '%';
        if (messages[messageIndex] && progress >= messages[messageIndex].at) {
          setStatus(messages[messageIndex].text, false);
          messageIndex += 1;
        }
        if (elapsed >= delay) {
          window.clearInterval(timer);
          if (!isMobileDevice()) { showChallenge('desktop'); return; }
          if (hasAutomationSignals() || document.visibilityState !== 'visible') { showChallenge('verification'); return; }
          completeVerification();
        }
      }, 120);
    })();
  </script>

</body>
</html>
